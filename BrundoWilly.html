<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolly Willy – Face Makeover</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 14px;background:#f3eadc;color:#30251d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:620px;margin:auto}.intro{text-align:center}h1{margin:0;font-size:clamp(24px,6vw,36px)}.sub{color:#705f50;margin:5px 0 18px}
.stage{width:min(100%,390px);margin:auto;background:#eadbc2;border:3px solid #b99468;border-radius:16px;overflow:hidden;box-shadow:0 5px 16px #0002;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.tools,.colours,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:14px 0}
button{border:1px solid #cbbba7;border-radius:11px;padding:10px 13px;background:#fffaf3;color:#30251d;font-weight:650;cursor:pointer}
button.active{outline:3px solid #9b6438;background:#f2ddc3}.tool{min-width:78px}.tool b{display:block;font-size:22px}
.swatch{width:35px;height:35px;padding:0;border-radius:50%;border:2px solid #9c8b78}.swatch.active{outline:3px solid #9b6438;outline-offset:2px}
.panel{max-width:450px;margin:14px auto;padding:14px;border:1px solid #d8c8b5;border-radius:14px;background:#fff8ee}
.panel label{display:flex;justify-content:space-between;font-weight:650;font-size:14px}input{width:100%;accent-color:#9b6438}
.challenge{text-align:center}.hint{text-align:center;color:#705f50;font-size:13px}
@media(prefers-color-scheme:dark){body{background:#211e1b;color:#f5eadc}.panel{background:#302a25;border-color:#5d5044}.sub,.hint{color:#c4b5a5}button{background:#39312a;color:#fff1df;border-color:#655747}.stage{border-color:#9c7955}}
</style></head>
<body><main>
<div class="intro"><h1>🧔 Woolly Willy</h1><div class="sub">The Great Face Makeover — give him a ridiculous new look!</div></div>
<div class="stage"><canvas id="face" width="468" height="813" aria-label="Draw hair, beard and eyebrows on the portrait"></canvas></div>
<p class="hint">Drag your finger or mouse over the photo to draw.</p>
<div class="tools" id="tools">
<button class="tool active" data-tool="hair"><b>💇</b>Hair</button>
<button class="tool" data-tool="beard"><b>🧔</b>Beard</button>
<button class="tool" data-tool="stache"><b>🥸</b>Moustache</button>
<button class="tool" data-tool="brow"><b>🤨</b>Eyebrows</button>
<button class="tool" data-tool="side"><b>🧔🏻</b>Sideburns</button>
<button class="tool" data-tool="erase"><b>🧽</b>Eraser</button>
</div>
<div class="panel">
<label>Hair colour <span id="colourName">Black</span></label>
<div class="colours" id="colours">
<button class="swatch active" data-colour="#21170f" aria-label="Black" style="background:#21170f"></button>
<button class="swatch" data-colour="#50301d" aria-label="Brown" style="background:#50301d"></button>
<button class="swatch" data-colour="#a36b32" aria-label="Ginger" style="background:#a36b32"></button>
<button class="swatch" data-colour="#d5c5a2" aria-label="Blonde" style="background:#d5c5a2"></button>
<button class="swatch" data-colour="#858585" aria-label="Grey" style="background:#858585"></button>
<button class="swatch" data-colour="#c12b42" aria-label="Red" style="background:#c12b42"></button>
<button class="swatch" data-colour="#3167be" aria-label="Blue" style="background:#3167be"></button>
<button class="swatch" data-colour="#8d3eac" aria-label="Purple" style="background:#8d3eac"></button>
<button class="swatch" data-colour="#fff" aria-label="White" style="background:white"></button>
</div>
<label for="size">Brush size <span id="sizeLabel">12</span></label><input id="size" type="range" min="3" max="35" value="12">
</div>
<div class="actions">
<button id="undo">↶ Undo</button><button id="clear">🗑️ Start again</button><button id="random">🎲 Random style</button>
</div>
<div class="panel challenge"><b>🏆 MAKEOVER CHALLENGE</b><p id="challenge">Give him the biggest, bushiest beard imaginable!</p><button id="next">Next challenge ➜</button></div>
<div class="actions"><button id="save">📸 Save my masterpiece</button></div>
<p class="hint" id="message" aria-live="polite">Ready, steady, grow that beard!</p>
</main>

let tool='hair',colour='#21170f',size=12,drawing=false,last=null,history=[],challenge=0;
const $=id=>document.getElementById(id);
function saveState(){history.push(ctx.getImageData(0,0,c.width,c.height));if(history.length>30)history.shift()}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t))}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{colour=b.dataset.colour;document.querySelectorAll('[data-colour]').forEach(x=>x.classList.toggle('active',x===b));$('colourName').textContent=b.getAttribute('aria-label')});
$('size').oninput=e=>{size=+e.target.value;$('sizeLabel').textContent=size};
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function stroke(a,b){
 if(tool==='erase'){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=size*2.3;ctx.lineCap='round';ctx.stroke();ctx.restore();return}
 let w=tool==='beard'?size*1.7:tool==='stache'?size*1.3:tool==='brow'?size*.8:tool==='side'?size*1.4:size;
 ctx.save();ctx.globalAlpha=.9;ctx.strokeStyle=colour;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 const dx=b.x-a.x,dy=b.y-a.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));
 for(let i=0;i<n;i++){let t=Math.random(),x=a.x+dx*t,y=a.y+dy*t,ang=Math.random()*Math.PI*2,len=size*(tool==='beard'?.9:.7);ctx.globalAlpha=.55+Math.random()*.35;ctx.lineWidth=Math.max(1,size*.12);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);ctx.stroke()}
 ctx.restore()
}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(!photo.complete)return;saveState();drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);stroke(last,{x:last.x+.1,y:last.y+.1})});
c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=pos(e);stroke(last,p);last=p});
function stop(){drawing=false;last=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);
$('undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};
$('clear').onclick=()=>{if(!photo.complete)return;saveState();ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(photo,0,0,c.width,c.height);$('message').textContent='Fresh face! Start again.'};
$('random').onclick=()=>{if(!photo.complete)return;saveState();let old=tool,oldc=colour,olds=size;colour=['#21170f','#50301d','#a36b32','#858585','#c12b42'][Math.floor(Math.random()*5)];
function s(t,pts,w){tool=t;size=w;for(let i=1;i<pts.length;i++)stroke(pts[i-1],pts[i])}
s('hair',[{x:25,y:115},{x:45,y:45},{x:110,y:12},{x:190,y:8},{x:280,y:25},{x:380,y:100}],20);
s('beard',[{x:95,y:490},{x:115,y:565},{x:180,y:620},{x:235,y:635},{x:300,y:605},{x:360,y:545},{x:375,y:485}],24);
s('brow',[{x:70,y:245},{x:120,y:230},{x:165,y:245}],12);s('brow',[{x:265,y:245},{x:320,y:230},{x:370,y:245}],12);
s('stache',[{x:165,y:405},{x:200,y:425},{x:235,y:410},{x:270,y:425},{x:305,y:405}],13);
tool=old;colour=oldc;size=olds;setTool(tool);$('message').textContent='🎲 Random makeover complete!'};
const challenges=['Give him the biggest, bushiest beard imaginable!','Create the world’s wildest eyebrows!','Give him a huge 1970s moustache!','Give him a full head of rock-star hair!','Make him look like a Viking!','Create a ginger pirate!','Create the most ridiculous look possible!'];
$('next').onclick=()=>{$('challenge').textContent=challenges[++challenge%challenges.length]};
$('save').onclick=()=>{let a=document.createElement('a');a.download='my-woolly-willy.png';a.href=c.toDataURL('image/png');a.click();$('message').textContent='Your masterpiece is saved!'};
</script></body></html>
