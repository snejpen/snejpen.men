<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel spin — Snejpen.men</title>
<link rel="stylesheet" href="site.css">
<style>
  /* Styles that only this page needs. Shared styles live in site.css */

  .layout {
    --wheel-size: min(clamp(300px, 70vmin, 800px), 650px);
    display: grid;
    grid-template-columns: minmax(260px, 340px) 1fr;
    gap: 20px;
    align-items: stretch;
  }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .text-panel { display: flex; flex-direction: column; }
  .panel h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .panel .hint { margin: 0 0 14px; font-size: 13px; color: var(--text-dim); line-height: 1.45; }

  textarea {
    display: block;
    width: 100%;
    flex: 1;                /* fills the panel, so it's as tall as the wheel area */
    min-height: 240px;
    resize: none;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
  }
  textarea:focus-visible { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(191, 189, 182, 0.16); }
  textarea::placeholder { color: var(--text-faint); }
  textarea:disabled { opacity: 0.6; cursor: not-allowed; }

  .list-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .toggles { display: flex; flex-direction: column; gap: 8px; }
  .toggles .audio-toggle { justify-content: flex-start; margin-top: 0; }
  .toggles .audio-toggle label { font-size: 13px; }
  .rows[hidden], textarea[hidden] { display: none; }
  .rows {
    flex: 1 1 0;               /* same size as the text box, scrolls when there are many options */
    min-height: 240px;
    overflow-y: auto;
    background: var(--bg-input);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 8px;
  }
  .row { display: grid; grid-template-columns: 1fr 76px 30px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .row input[type="text"], .row input[type="number"] {
    background: var(--bg-panel);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    padding: 8px 10px;
    min-width: 0;
    width: 100%;
  }
  .row input:focus-visible { outline: none; border-color: var(--focus); }
  .row input:disabled, .row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row .del { background: transparent; color: var(--text-dim); border: 1px solid transparent; border-radius: 7px; height: 100%; font-size: 16px; line-height: 1; }
  .row .del:hover { background: var(--bg-raised-hover); color: var(--text); }
  .add-row { width: 100%; margin-top: 2px; padding: 8px; border-radius: 7px; border: 1px dashed var(--line-strong); background: transparent; color: var(--text-dim); font-size: 13px; }
  .add-row:hover { background: var(--bg-raised-hover); color: var(--text); }
  .remove-toggle { display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--text); font-size: 13px; }
  .remove-toggle input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; margin: 0; }
  .save-warning { margin: 8px 0 0; font-size: 12.5px; color: var(--danger); display: none; }

  .result-banner {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    margin-bottom: 26px;
    visibility: hidden;
  }
  .result-banner.show { visibility: visible; }
  .result-label { font-size: 12px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.08em; margin-bottom: 6px; }
  .result-name { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--text); word-break: break-word; }

  .wheel-area {
    position: relative;
    display: flex;
    justify-content: center;
    width: 100%;
    margin-bottom: 22px;
  }
  .wheel-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 30px solid var(--primary-hover);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
    z-index: 2;
  }
  .wheel-wrap {
    width: min(100%, var(--wheel-size));   /* the same size with one wheel or two */
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-shadow: 0 0 0 8px var(--bg-raised), 0 0 0 9px var(--line-strong), 0 14px 40px rgba(0,0,0,0.55);
    transition: transform 4.2s cubic-bezier(0.14, 0.67, 0.2, 1);
  }
  .wheel-wrap svg { display: block; border-radius: 50%; }

  .wheel-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .wheel-controls button {
    padding: 12px 22px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 650;
  }
  .primary-action { background: var(--primary); color: var(--on-primary); }
  .primary-action:hover { background: var(--primary-hover); }
  .primary-action:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
  .secondary-action { background: var(--bg-raised); border: 1px solid var(--line-strong); color: var(--text); }
  .secondary-action:hover { background: var(--bg-raised-hover); }

  .small-action { padding: 6px 12px; border-radius: 7px; font-size: 12.5px; background: var(--bg-raised); border: 1px solid var(--line-strong); color: var(--text); }
  .small-action:hover { background: var(--bg-raised-hover); }

  /* ---------- second wheel ---------- */
  .page.wide { max-width: 1500px; }
  /* with two wheels they sit side by side on top, nearly as big as a lone wheel; the editors go underneath */
  .two { grid-template-columns: 1fr; }
  .two .wheels-panel { order: -1; }
  .two .text-panel h1, .two .text-panel .hint { display: none; }
  .editors { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .two .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: none; }
  .two .editor + .editor { margin-top: 0; }
  .two textarea, .two .rows { flex: none; height: 170px; min-height: 0; }
  @media (max-width: 800px) { .two .editors { grid-template-columns: 1fr; } }
  .editor { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .editor-title { display: none; margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .two .editor-title { display: block; }
  .editor[hidden] { display: none; }
  .wheels { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 4px; }
  .wheel-unit .wheel-controls { margin-top: 0; }
  .wheel-unit { flex: 1 1 0; min-width: 0; }
  .wheel-unit[hidden] { display: none; }
  .wheel-unit .result-name { font-size: 22px; }
</style>
</head>
<body>

<header id="site-nav"></header>

<main class="page" id="page">
  <div class="layout">

    <section class="panel text-panel">
      <h1>Wheel spin</h1>
      <p class="hint">Type your options, one per line. They appear on the wheel as you type and are saved on this device, so they're still here next time.</p>

      <div class="editors">
      <div class="editor" data-wheel="0">
        <div class="editor-title">Wheel 1</div>
        <textarea spellcheck="false" aria-label="Wheel 1 options" placeholder="Pizza&#10;Sushi&#10;Tacos&#10;Burgers"></textarea>
        <div class="rows" hidden></div>
      </div>
      <div class="editor" data-wheel="1" hidden>
        <div class="editor-title">Wheel 2</div>
        <textarea spellcheck="false" aria-label="Wheel 2 options" placeholder="Movie&#10;Walk&#10;Game night"></textarea>
        <div class="rows" hidden></div>
      </div>
      </div>

      <div class="list-foot">
        <div class="toggles">
          <label class="remove-toggle"><input type="checkbox" id="useWeightsToggle"><span>Use weights</span></label>
          <label class="remove-toggle"><input type="checkbox" id="removeWinnerToggle"><span>Remove winner from the list</span></label>
          <label class="remove-toggle"><input type="checkbox" id="secondWheelToggle"><span>Use 2nd wheel</span></label>
          <div id="audioSlot"></div>
        </div>
        <button class="small-action" id="clearBtn" type="button">Clear all</button>
      </div>
      <p class="save-warning" id="saveWarning">Couldn't save in this browser, so the list won't be kept.</p>
    </section>

    <section class="panel wheels-panel">
      <div class="wheels" id="wheels">
        <div class="wheel-unit" data-wheel="0">
          <div class="result-banner" aria-live="polite">
            <div class="result-label">SELECTED</div>
            <div class="result-name">—</div>
          </div>
          <div class="wheel-area">
            <div class="wheel-pointer"></div>
            <div class="wheel-wrap"><svg viewBox="0 0 300 300" width="100%" height="100%"></svg></div>
          </div>
          <div class="wheel-controls">
            <button class="primary-action spin-btn" type="button" disabled>Spin the wheel</button>
          </div>
        </div>
        <div class="wheel-unit" data-wheel="1" hidden>
          <div class="result-banner" aria-live="polite">
            <div class="result-label">SELECTED</div>
            <div class="result-name">—</div>
          </div>
          <div class="wheel-area">
            <div class="wheel-pointer"></div>
            <div class="wheel-wrap"><svg viewBox="0 0 300 300" width="100%" height="100%"></svg></div>
          </div>
          <div class="wheel-controls">
            <button class="primary-action spin-btn" type="button" disabled>Spin the wheel</button>
          </div>
        </div>
      </div>

    </section>

  </div>
</main>

<script src="site.js"></script>
<script>
(function () {
  "use strict";

  if (window.SiteAudio) SiteAudio.mount(document.getElementById("audioSlot"));

  const REMOVE_KEY = "snejpenWheelSpinRemoveWinner";
  const USE_WEIGHTS_KEY = "snejpenWheelSpinUseWeights";
  const SECOND_KEY = "snejpenWheelSpinSecondWheel";
  const DEFAULT_WEIGHT = 10;          // what a new option starts with when weights are on

  const page = document.getElementById("page");
  const removeWinnerToggle = document.getElementById("removeWinnerToggle");
  const useWeightsToggle = document.getElementById("useWeightsToggle");
  const secondWheelToggle = document.getElementById("secondWheelToggle");
  const saveWarning = document.getElementById("saveWarning");
  const clearBtn = document.getElementById("clearBtn");

  let useWeights = false;
  let secondOn = false;
  let spinningCount = 0;   // how many wheels are turning right now
  let wheels = [];

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* =========================================================
     Wheel drawing (same wheel as the Random name selector)
     ========================================================= */

  const SVG_NS = "http://www.w3.org/2000/svg";
  // extra-bright, highly saturated colours so the wheel really pops. They're ordered so neighbouring slices always
  // differ strongly in hue, and each slice picks white or dark label text, whichever reads better.
  const WHEEL_PALETTE = ["#ff3b1f", "#00d4c8", "#ffd400", "#a64dff", "#ff8a00", "#1fe05a", "#ff2e93", "#2d8cff"];
  const WHEEL_INK_LIGHT = "#ffffff";
  const WHEEL_INK_DARK = "#1d1d1c";
  const WHEEL_EDGE = "#272726";   // thin lines between slices
  const WHEEL_HUB = "#1d1d1c";
  const WHEEL_HUB_RING = "#a9a7a0";
  const SPIN_DURATION_MS = 4300;

  function hueOf(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d === 0) return 0;
    let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (h * 60 + 360) % 360;
  }

  function luminance(hex) {
    const ch = [1, 3, 5].map(function (i) {
      const c = parseInt(hex.slice(i, i + 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  function contrast(a, b) {
    const la = luminance(a), lb = luminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  function inkFor(bg) {
    return contrast(WHEEL_INK_LIGHT, bg) >= contrast(WHEEL_INK_DARK, bg) ? WHEEL_INK_LIGHT : WHEEL_INK_DARK;
  }

  function hueGap(a, b) {
    const d = Math.abs(hueOf(a) - hueOf(b));
    return Math.min(d, 360 - d);
  }

  function polarPoint(cx, cy, r, angleDeg) {
    const rad = (angleDeg * Math.PI) / 180;
    return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
  }

  function truncateName(name, max) {
    return name.length > max ? name.slice(0, Math.max(1, max - 1)) + "…" : name;
  }

  /* ---- label layout ----
     While slices are wide, names run across the slice (nice and readable).
     Once they get too narrow for that, names are turned to run along the slice,
     starting at the rim and heading toward the middle, so neighbours can't collide.
     Text size and length are chosen from how much room a slice really has. */
  const CHAR_W = 0.62;        // width of one monospace character, as a fraction of font size
  const R_RIM = 146;          // outer edge of the wheel (in viewBox units)
  const R_TEXT_END = 140;     // where along-the-slice text starts, just inside the rim
  const R_TEXT_MIN = 26;      // keep text clear of the centre hub
  const MIN_RADIAL_FONT = 4.5;

  function chooseLabelLayout(names, segAngle) {
    const segRad = (segAngle * Math.PI) / 180;
    const longest = names.reduce(function (m, n) { return Math.max(m, n.length); }, 0);

    // this wheel always runs the text along the slice, which leaves room for much longer options

    // 2) along the slice: biggest font where the longest name still fits, and where the
    //    slice is still thick enough at the inner end of the text
    const thickness = 1.25 / segRad; // a text line's box is ~1.17x its font size, plus a little air
    const L = Math.min(longest, 34);
    let font = Math.min(14, R_TEXT_END / (CHAR_W * L + thickness), (R_TEXT_END - R_TEXT_MIN) / (CHAR_W * L));
    let chars = L;
    if (font < MIN_RADIAL_FONT) {
      font = MIN_RADIAL_FONT;
      chars = Math.floor(Math.min(
        (R_TEXT_END - thickness * font) / (CHAR_W * font),
        (R_TEXT_END - R_TEXT_MIN) / (CHAR_W * font)
      ));
    }
    if (chars < 3) return { mode: "none" }; // too many slices for readable text; the winner banner still names the pick
    return { mode: "along", fontSize: font, chars: chars };
  }

  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
    return el;
  }

  function clearWheel(svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
  }

  function renderWheelPlaceholder(svg) {
    clearWheel(svg);
    svg.appendChild(svgEl("circle", { cx: 150, cy: 150, r: 146, fill: "#1f1f1e", stroke: "#393937", "stroke-width": 2 }));
    const line1 = svgEl("text", { x: 150, y: 142, fill: "#a5a39b", "font-size": 13, "font-family": "sans-serif", "text-anchor": "middle" });
    line1.textContent = "Add an option";
    const line2 = svgEl("text", { x: 150, y: 160, fill: "#a5a39b", "font-size": 13, "font-family": "sans-serif", "text-anchor": "middle" });
    line2.textContent = "to fill the wheel";
    svg.appendChild(line1);
    svg.appendChild(line2);
  }

  // slice sizes follow the weights: a weight of 5 gets 5 times the angle of a weight of 1
  function wheelGeometry(ws) {
    const total = ws.reduce(function (a, b) { return a + b; }, 0);
    const spans = ws.map(function (w) { return 360 * w / total; });
    const starts = [];
    let acc = 0;
    spans.forEach(function (sp) { starts.push(acc); acc += sp; });
    return { starts: starts, spans: spans };
  }

  function renderWheel(svg, names, ws) {
    clearWheel(svg);
    const n = names.length;
    const geo = wheelGeometry(ws);
    const starts = geo.starts, spans = geo.spans;
    const allEqual = ws.every(function (w) { return w === ws[0]; });
    const cx = 150, cy = 150, r = 146;

    const colors = names.map(function (_, i) { return WHEEL_PALETTE[i % WHEEL_PALETTE.length]; });
    if (n > 2) {
      // the last slice sits next to the first one, which the repeating palette doesn't account for;
      // if it ends up too similar to either neighbour, give it the colour that stands out most from both
      const gapTo = function (c) { return Math.min(hueGap(c, colors[0]), hueGap(c, colors[n - 2])); };
      if (gapTo(colors[n - 1]) < 40) {
        colors[n - 1] = WHEEL_PALETTE.reduce(function (best, c) { return gapTo(c) > gapTo(best) ? c : best; });
      }
    }

    if (n === 1) {
      // a single option is the whole wheel (an arc can't start and end at the same point)
      svg.appendChild(svgEl("circle", { cx: cx, cy: cy, r: r, fill: colors[0], stroke: WHEEL_EDGE, "stroke-width": 2 }));
    }
    for (let i = 0; i < (n === 1 ? 0 : n); i++) {
      const [x1, y1] = polarPoint(cx, cy, r, starts[i]);
      const [x2, y2] = polarPoint(cx, cy, r, starts[i] + spans[i]);
      const largeArc = spans[i] > 180 ? 1 : 0;
      svg.appendChild(svgEl("path", {
        d: "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + largeArc + " 1 " + x2 + " " + y2 + " Z",
        fill: colors[i],
        stroke: WHEEL_EDGE,
        "stroke-width": 2
      }));
    }

    // equal slices share one text size; with weights each slice is sized to its own room
    const sharedLayout = allEqual ? chooseLabelLayout(names, 360 / n) : null;
    {
      for (let i = 0; i < n; i++) {
        const layout = sharedLayout || chooseLabelLayout([names[i]], spans[i]);
        if (layout.mode === "none") continue;
        const midA = starts[i] + spans[i] / 2;
        const label = truncateName(names[i], layout.chars);
        let attrs;

        if (layout.mode === "across") {
          const [lx, ly] = polarPoint(cx, cy, r * 0.63, midA);
          attrs = {
            x: lx, y: ly,
            "text-anchor": "middle",
            transform: "rotate(" + midA + " " + lx + " " + ly + ")"
          };
        } else {
          // every label is set the same way, whichever slice it's on: it reads from the middle outward
          // and ends at the rim. The wheel is always turning, so there's no "right way up" to protect.
          attrs = {
            x: cx + R_TEXT_END, y: cy,
            "text-anchor": "end",
            transform: "rotate(" + (midA - 90) + " " + cx + " " + cy + ")"
          };
        }

        const text = svgEl("text", Object.assign({
          fill: inkFor(colors[i]),
          "font-size": layout.fontSize,
          "font-family": "monospace",
          "font-weight": 700,
          "dominant-baseline": "middle"
        }, attrs));
        text.textContent = label;
        svg.appendChild(text);
      }
    }

    svg.appendChild(svgEl("circle", { cx: cx, cy: cy, r: 15, fill: WHEEL_HUB, stroke: WHEEL_HUB_RING, "stroke-width": 3 }));
  }


  /* =========================================================
     One wheel with its own list, weights and idle drift
     ========================================================= */

  const IDLE_DEG_PER_SECOND = 7;      // about one turn a minute
  const IDLE_HOLD_MS = 2500;          // after a result the wheels rest this long before drifting again
  let saveTimer = null;

  function createWheel(i) {
    const suffix = i === 0 ? "" : "_2";
    const STORAGE_KEY = "snejpenWheelSpinOptions" + suffix;        // wheel 1 keeps the key it always had
    const WEIGHTS_KEY = "snejpenWheelSpinWeightsV2" + suffix;      // V2: weights now start at 10

    const editor = document.querySelector('.editor[data-wheel="' + i + '"]');
    const unit = document.querySelector('.wheel-unit[data-wheel="' + i + '"]');
    const optionsInput = editor.querySelector("textarea");
    const rowsEl = editor.querySelector(".rows");
    const banner = unit.querySelector(".result-banner");
    const resultName = unit.querySelector(".result-name");
    const wheelWrap = unit.querySelector(".wheel-wrap");
    const wheelSvg = unit.querySelector("svg");
    const spinBtn = unit.querySelector(".spin-btn");
    let spinning = false;
    let idleHold = false;

    let weights = [];                // saved weight for each text line (index = line number)
    let names = [], ws = [], lines = [], starts = [], spans = [];
    let rotation = 0;
    let idleFrame = null, idleLast = 0;
    let spinTimer = null;
    let winner = -1;

    function rawLines() { return optionsInput.value.split(/\r?\n/); }
    function setLines(l) { optionsInput.value = l.join("\n"); }
    function weightAt(n) {
      const w = weights[n];
      return typeof w === "number" && isFinite(w) && w > 0 ? w : DEFAULT_WEIGHT;
    }

    /* ---- idle drift ---- */
    function idleTick(now) {
      if (!idleLast) idleLast = now;
      rotation += IDLE_DEG_PER_SECOND * (now - idleLast) / 1000;
      idleLast = now;
      wheelWrap.style.transition = "none";
      wheelWrap.style.transform = "rotate(" + rotation + "deg)";
      idleFrame = requestAnimationFrame(idleTick);
    }
    function startIdle() {
      if (reduceMotion || idleFrame !== null || spinning || idleHold || names.length < 1) return;
      idleLast = 0;
      idleFrame = requestAnimationFrame(idleTick);
    }
    function stopIdle() {
      if (idleFrame !== null) cancelAnimationFrame(idleFrame);
      idleFrame = null;
      wheelWrap.style.transition = "";
      void wheelWrap.offsetWidth;
    }
    function normalize() {   // keep the angle tidy without any visible movement
      rotation = ((rotation % 360) + 360) % 360;
      wheelWrap.style.transition = "none";
      wheelWrap.style.transform = "rotate(" + rotation + "deg)";
      void wheelWrap.offsetWidth;
      wheelWrap.style.transition = "";
    }

    /* ---- drawing ---- */
    function refresh() {
      names = []; ws = []; lines = [];
      rawLines().forEach(function (line, n) {
        const t = line.trim();
        if (!t) return;
        names.push(t); lines.push(n); ws.push(useWeights ? weightAt(n) : 1);
      });
      if (names.length >= 1) {
        const geo = wheelGeometry(ws);
        starts = geo.starts; spans = geo.spans;
        renderWheel(wheelSvg, names, ws);
      } else {
        renderWheelPlaceholder(wheelSvg);
      }
      if (names.length < 1) { stopIdle(); rotation = 0; wheelWrap.style.transform = "rotate(0deg)"; }
      else startIdle();
      updateSpinButton();
    }

    function updateSpinButton() { spinBtn.disabled = spinning || names.length < 1; }

    /* ---- saving ---- */
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, optionsInput.value);
        localStorage.setItem(WEIGHTS_KEY, JSON.stringify(rawLines().map(function (_, n) { return weightAt(n); })));
        saveWarning.style.display = "none";
      } catch (err) {
        saveWarning.style.display = "block";
      }
    }

    function changed() {
      banner.classList.remove("show");
      normalize();
      refresh();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveAll, 250);
    }

    /* ---- weights editor ---- */
    function renderRows() {
      rowsEl.textContent = "";
      rawLines().forEach(function (line, n) {
        const name = document.createElement("input");
        name.type = "text"; name.value = line; name.placeholder = "Option"; name.spellcheck = false;
        name.setAttribute("aria-label", "Option " + (n + 1));
        const weight = document.createElement("input");
        weight.type = "number"; weight.min = "0"; weight.step = "any"; weight.value = weightAt(n);
        weight.setAttribute("aria-label", "Weight for option " + (n + 1));
        const del = document.createElement("button");
        del.type = "button"; del.className = "del"; del.textContent = "×"; del.title = "Remove option";
        del.setAttribute("aria-label", "Remove option " + (n + 1));
        const row = document.createElement("div");
        row.className = "row";
        row.appendChild(name); row.appendChild(weight); row.appendChild(del);
        rowsEl.appendChild(row);

        name.addEventListener("input", function () { collectRows(); changed(); });
        name.addEventListener("keydown", function (e) {
          if (e.key !== "Enter") return;
          e.preventDefault();
          insertRow(n + 1);
        });
        weight.addEventListener("input", function () {
          const v = parseFloat(weight.value);
          weights[n] = v > 0 ? v : DEFAULT_WEIGHT;
          changed();
        });
        weight.addEventListener("blur", function () { weight.value = weightAt(n); });
        del.addEventListener("click", function () {
          const l = rawLines();
          l.splice(n, 1); weights.splice(n, 1);
          setLines(l);
          renderRows();
          changed();
        });
      });
      const add = document.createElement("button");
      add.type = "button"; add.className = "add-row"; add.textContent = "+ Add option";
      add.addEventListener("click", function () { insertRow(rawLines().length); });
      rowsEl.appendChild(add);
    }

    function collectRows() {
      setLines(Array.prototype.map.call(rowsEl.querySelectorAll(".row input[type=text]"), function (el) { return el.value.replace(/[\r\n]+/g, " "); }));
    }

    function insertRow(at) {
      const l = rawLines();
      l.splice(at, 0, "");
      weights.splice(at, 0, DEFAULT_WEIGHT);
      setLines(l);
      renderRows();
      const inputs = rowsEl.querySelectorAll(".row input[type=text]");
      if (inputs[at]) inputs[at].focus();
      changed();
    }

    function showMode() {
      optionsInput.hidden = useWeights;
      rowsEl.hidden = !useWeights;
      if (useWeights) renderRows();
      banner.classList.remove("show");
      refresh();
    }

    optionsInput.addEventListener("input", changed);

    function setEditable(on) {
      optionsInput.disabled = !on;
      rowsEl.querySelectorAll("input, button").forEach(function (el) { el.disabled = !on; });
    }

    function clearList() {
      optionsInput.value = "";
      weights = [];
      if (useWeights) renderRows();
      banner.classList.remove("show");
      normalize();
      refresh();
    }

    /* ---- spinning ---- */
    function hasOptions() { return names.length >= 1; }

    // starts this wheel turning toward a weighted random winner
    function beginSpin() {
      stopIdle();
      banner.classList.remove("show");
      const total = ws.reduce(function (a, b) { return a + b; }, 0);
      let pick = Math.random() * total;
      winner = ws.length - 1;
      for (let n = 0; n < ws.length; n++) {
        pick -= ws[n];
        if (pick < 0) { winner = n; break; }
      }
      const centerAngle = starts[winner] + spans[winner] / 2;
      const targetOffset = ((-centerAngle % 360) + 360) % 360;
      const baseline = Math.ceil((rotation + 1) / 360) * 360;
      let next = baseline + 5 * 360 + targetOffset;
      while (next <= rotation) next += 360;
      rotation = next;
      wheelWrap.style.transform = "rotate(" + rotation + "deg)";
    }

    function showWinner() {
      resultName.textContent = names[winner];
      banner.classList.add("show");
    }

    function removeWinner() {
      const l = rawLines();
      l.splice(lines[winner], 1);
      weights.splice(lines[winner], 1);
      setLines(l);
      if (useWeights) renderRows();
      normalize();
    }

    function spin() {
      if (spinning || names.length < 1) return;
      spinning = true;
      spinningCount++;
      lockShared();
      updateSpinButton();
      setEditable(false);
      beginSpin();
      if (window.SiteAudio) SiteAudio.spin();

      setTimeout(function () {
        showWinner();
        if (window.SiteAudio) SiteAudio.win();
        spinBtn.textContent = "Spin again";

        function finish() {
          spinning = false;
          spinningCount--;
          lockShared();
          setEditable(true);
          idleHold = true;      // let the result sit under the pointer for a moment, then drift again
          refresh();
          setTimeout(function () { idleHold = false; startIdle(); }, IDLE_HOLD_MS);
        }

        if (removeWinnerToggle.checked) {
          // let the wheel sit on the winner for a moment, then take it off the list
          setTimeout(function () { removeWinner(); save(); finish(); }, 1500);
        } else {
          finish();
        }
      }, SPIN_DURATION_MS);
    }
    spinBtn.addEventListener("click", spin);

    function load() {
      try {
        optionsInput.value = localStorage.getItem(STORAGE_KEY) || "";
        const saved = JSON.parse(localStorage.getItem(WEIGHTS_KEY) || "[]");
        if (Array.isArray(saved)) weights = saved;
      } catch (err) {}
    }

    return {
      refresh: refresh, updateSpinButton: updateSpinButton, save: save, showMode: showMode, load: load, setEditable: setEditable,
      clearList: clearList, hasOptions: hasOptions, startIdle: startIdle, normalize: normalize, hideBanner: function () { banner.classList.remove("show"); },
      isEmpty: function () { return !optionsInput.value.trim(); },
      focus: function () { optionsInput.focus(); }
    };
  }

  function activeWheels() { return secondOn ? wheels : [wheels[0]]; }
  function saveAll() { wheels.forEach(function (w) { w.save(); }); }
  // the shared settings can't change while any wheel is turning
  function lockShared() {
    const busy = spinningCount > 0;
    clearBtn.disabled = busy;
    useWeightsToggle.disabled = busy;
    secondWheelToggle.disabled = busy;
  }

  /* =========================================================
     Controls shared by both wheels
     ========================================================= */

  function setSecond(on) {
    secondOn = on;
    secondWheelToggle.checked = on;
    document.querySelector('.editor[data-wheel="1"]').hidden = !on;
    document.querySelector('.wheel-unit[data-wheel="1"]').hidden = !on;
    document.querySelector(".layout").classList.toggle("two", on);
    page.classList.toggle("wide", on);
    wheels[0].refresh();            // the first wheel changes size when it shares the row
    if (on) wheels[1].refresh();
  }

  secondWheelToggle.addEventListener("change", function () {
    setSecond(secondWheelToggle.checked);
    try { localStorage.setItem(SECOND_KEY, secondOn ? "1" : "0"); } catch (err) {}
  });

  useWeightsToggle.addEventListener("change", function () {
    useWeights = useWeightsToggle.checked;
    wheels.forEach(function (w) { w.showMode(); });
    saveAll();
    try { localStorage.setItem(USE_WEIGHTS_KEY, useWeights ? "1" : "0"); } catch (err) {}
  });

  removeWinnerToggle.addEventListener("change", function () {
    try { localStorage.setItem(REMOVE_KEY, removeWinnerToggle.checked ? "1" : "0"); } catch (err) {}
  });

  clearBtn.addEventListener("click", function () {
    if (activeWheels().every(function (w) { return w.isEmpty(); })) return;
    if (!window.confirm(secondOn ? "Remove all options from both wheels?" : "Remove all options from the wheel?")) return;
    activeWheels().forEach(function (w) { w.clearList(); });
    saveAll();
    wheels[0].focus();
  });

  window.addEventListener("pagehide", function () { clearTimeout(saveTimer); saveAll(); });

  /* =========================================================
     Start-up: bring back what was saved last time
     ========================================================= */

  wheels = [createWheel(0), createWheel(1)];
  wheels.forEach(function (w) { w.load(); });
  try {
    removeWinnerToggle.checked = localStorage.getItem(REMOVE_KEY) === "1";
    useWeights = localStorage.getItem(USE_WEIGHTS_KEY) === "1";
    secondOn = localStorage.getItem(SECOND_KEY) === "1";
  } catch (err) {}
  useWeightsToggle.checked = useWeights;
  wheels.forEach(function (w) { w.showMode(); });
  setSecond(secondOn);
})();
</script>
</body>
</html>
